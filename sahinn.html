<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin: 0;
        }

        header {
            background: #0078d7;
            color: white;
            padding: 20px;
        }

        main {
            padding: 40px;
        }

        button {
            background: #0078d7;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #005fa3;
        }
    </style>
</head>
<body>

<header>
    <h1>Welkom!</h1>
</header>

<main>
    <p>Dit is een simpele website.</p>
    <button onclick="alert('Hallo!')">Klik hier</button>
</main>

</body>
</html>
